<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Terminal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Consolas, monospace;
      background: #0a0a0f;
      color: #00ff88;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      padding: 12px 20px;
      border-bottom: 2px solid #00ff88;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0, 255, 136, 0.2);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #00ff88;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header .session-id {
      background: #00ff88;
      color: #0a0a0f;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 4px;
      background: #1a1a2e;
      color: #00ff88;
      border: 1px solid #00ff88;
    }

    .status.running {
      background: #00ff88;
      color: #0a0a0f;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .terminal {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #0a0a0f;
      font-size: 13px;
      line-height: 1.6;
    }

    .terminal::-webkit-scrollbar {
      width: 8px;
    }

    .terminal::-webkit-scrollbar-track {
      background: #0f0f1a;
    }

    .terminal::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 4px;
    }

    .terminal::-webkit-scrollbar-thumb:hover {
      background: #00cc6f;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      border-left: 3px solid;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .log-entry.success {
      border-left-color: #00ff88;
      color: #00ff88;
    }

    .log-entry.error {
      border-left-color: #ff4444;
      color: #ff4444;
      background: rgba(255, 68, 68, 0.05);
    }

    .log-entry.warn {
      border-left-color: #ffaa00;
      color: #ffaa00;
      background: rgba(255, 170, 0, 0.05);
    }

    .log-entry .timestamp {
      font-size: 11px;
      opacity: 0.6;
      min-width: 70px;
    }

    .log-entry .message {
      flex: 1;
      word-break: break-word;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      font-size: 14px;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 15px;
      opacity: 0.3;
    }

    .footer {
      background: #0f0f1a;
      padding: 8px 20px;
      border-top: 1px solid #1a1a2e;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer .log-count {
      color: #00ff88;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>Terminal —</span>
      <span class="session-id" id="sessionId">Session</span>
    </h1>
    <div class="status running">Running</div>
  </div>

  <div class="terminal" id="terminal">
    <div class="empty-state">
      <div class="icon">⚡</div>
      <div>Waiting for logs...</div>
    </div>
  </div>

  <div class="footer">
    <div>Session Terminal v1.0</div>
    <div class="log-count"><span id="logCount">0</span> logs</div>
  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const sessionIdEl = document.getElementById('sessionId');
    const logCountEl = document.getElementById('logCount');
    let logCount = 0;

    // Set session ID from URL params
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('id') || 'Unknown';
    sessionIdEl.textContent = `Session ${sessionId}`;

    // Remove empty state on first log
    function removeEmptyState() {
      const emptyState = terminal.querySelector('.empty-state');
      if (emptyState) emptyState.remove();
    }

    // Add log entry
    function addLog(type, message) {
      removeEmptyState();

      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;

      const timestamp = document.createElement('span');
      timestamp.className = 'timestamp';
      timestamp.textContent = new Date().toLocaleTimeString('en-GB');

      const messageEl = document.createElement('span');
      messageEl.className = 'message';
      messageEl.textContent = message;

      entry.appendChild(timestamp);
      entry.appendChild(messageEl);
      terminal.appendChild(entry);

      // Auto-scroll to bottom
      terminal.scrollTop = terminal.scrollHeight;

      // Update log count
      logCount++;
      logCountEl.textContent = logCount;
    }

    // Listen for logs from main process
    if (window.terminalAPI) {
      window.terminalAPI.onLog((type, message) => {
        addLog(type, message);
      });
    }

    // Test logs (for debugging)
    // addLog('success', 'Session started successfully');
    // addLog('warn', 'Retrying connection...');
    // addLog('error', 'Connection failed!');
  </script>
</body>
</html>
